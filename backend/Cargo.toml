[package]
name = "localscribe"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Private audio and video transcription on your computer"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
which = "8"
