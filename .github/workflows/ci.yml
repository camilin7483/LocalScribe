name: Build and verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localscribe-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            executable: localscribe
          - runner: windows-2025
            platform: windows
            executable: localscribe.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && 90 || 25 }}
    env:
      FULL_VERIFICATION: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
      LOCALSCRIBE_TEST_JOB_TIMEOUT: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && '900' || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Linux runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg desktop-file-utils libglib2.0-bin
      - name: Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --no-progress -y
      - name: Windows Whisper toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '20261117'
          $name = "llvm-mingw-$version-ucrt-x86_64"
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          curl.exe --fail --location --retry 3 --max-time 300 "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$name.zip" --output "$archive"
          if ($LASTEXITCODE -ne 0) { throw 'Could not download LLVM-MinGW.' }
          $sha = (Get-FileHash -Algorithm SHA256 "$archive").Hash
          if ($sha -ne '4d002e330a0f703625aa5ccbc37e96f8f824413e163bfc7336774aabd2c3a412') {
            throw 'LLVM-MinGW checksum mismatch.'
          }
          python -m zipfile -e "$archive" "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw 'Could not unpack LLVM-MinGW.' }
          $bin = Join-Path $env:RUNNER_TEMP "$name/bin"
          if (!(Test-Path (Join-Path $bin 'x86_64-w64-mingw32-clang.exe'))) {
            throw 'The LLVM-MinGW x64 compiler is missing.'
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configure toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.100.0
      - name: Rust checks
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: python scripts/build_native.py
      - name: Frontend audit
        run: npm --prefix frontend audit --audit-level=high
      - name: Rust advisory audit
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p .release/audit
          archive=.release/audit/cargo-audit.tgz
          curl --fail --location --retry 2 https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-unknown-linux-musl-v0.23.0.tgz --output "$archive"
          printf '%s  %s\n' 4f01c74ed84b2dffd0b1d37012a62cdf2a92c96e25bdf8eec7fcc0d4d3eb7811 "$archive" | sha256sum -c -
          tar -xzf "$archive" -C .release/audit
          .release/audit/cargo-audit-x86_64-unknown-linux-musl-v0.23.0/cargo-audit audit --db .release/audit/advisory-db
      - name: Fetch pinned test models
        run: python scripts/fetch_models.py .release/models
      - name: Install browser test dependencies
        if: env.FULL_VERIFICATION == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Chromium on Linux
        if: runner.os == 'Linux' && env.FULL_VERIFICATION == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Chromium on Windows
        if: runner.os == 'Windows' && env.FULL_VERIFICATION == 'true'
        run: python -m playwright install chromium
      - name: Package
        run: python scripts/package.py --platform ${{ matrix.platform }} --native .release/native --output packages
      - name: Extract the package
        id: extract
        shell: bash
        run: |
          mkdir -p .release/extracted
          archive=(packages/LocalScribe-*-${{ matrix.platform }}-x86_64.*)
          printf 'archive=%s\n' "${archive[0]}" >> "$GITHUB_OUTPUT"
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            tar -xzf "${archive[0]}" -C .release/extracted
          else
            python -m zipfile -e "${archive[0]}" .release/extracted
          fi
          package=(.release/extracted/LocalScribe-*)
          printf 'package=%s\n' "${package[0]}" >> "$GITHUB_OUTPUT"
      - name: Verify Linux desktop registration
        if: runner.os == 'Linux'
        env:
          PACKAGE: ${{ steps.extract.outputs.package }}
        run: python tests/desktop_menu.py "$PACKAGE"
      - name: Verify transcription API and recovery
        shell: bash
        env:
          PACKAGE: ${{ steps.extract.outputs.package }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          mode=--smoke
          if [[ "$FULL_VERIFICATION" == "true" ]]; then
            mode=--full
          fi
          python -u tests/integration.py --binary "$PACKAGE/$EXECUTABLE" --models .release/models "$mode"
      - name: Verify the browser workflow
        if: env.FULL_VERIFICATION == 'true'
        shell: bash
        env:
          PACKAGE: ${{ steps.extract.outputs.package }}
          EXECUTABLE: ${{ matrix.executable }}
        run: python -u tests/browser.py --binary "$PACKAGE/$EXECUTABLE" --models .release/models
      - name: Verify persistent inference and recovery
        if: env.FULL_VERIFICATION == 'true'
        shell: bash
        env:
          PACKAGE: ${{ steps.extract.outputs.package }}
          EXECUTABLE: ${{ matrix.executable }}
        run: python -u tests/worker.py --binary "$PACKAGE/$EXECUTABLE" --models .release/models --interrupt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package-${{ matrix.platform }}
          path: ${{ steps.extract.outputs.archive }}
          if-no-files-found: error

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Open a draft for the matching version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version=$(awk -F'"' '/^version = /{print $2; exit}' backend/Cargo.toml)
          test "$tag" = "v$version"
          cd release-assets
          sha256sum LocalScribe-* > SHA256SUMS.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'Release %s already exists.\n' "$tag"
            exit 0
          fi
          gh release create "$tag" --verify-tag --draft --prerelease --title "LocalScribe $version" --notes-file ../CHANGELOG.md ./*
